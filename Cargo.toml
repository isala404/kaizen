[package]
name = "kaizen"
version = "0.8.3"
edition = "2024"
rust-version = "1.92"

[features]
default = ["embedded-frontend"]
embedded-frontend = ["dep:rust-embed", "forge/embedded-frontend"]

[dependencies]
forge = { git = "https://github.com/isala404/forge", rev = "07e1a972d1cbfafc0bedb89764ee59c0b8ca8c5a", package = "forgex" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "macros"] }
tracing = "0.1"
bcrypt = "0.17"
dotenvy = "0.15"
rust-embed = { version = "8", optional = true }

[build-dependencies]
which = "7"
