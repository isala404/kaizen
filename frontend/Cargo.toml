[package]
name = "kaizen-frontend"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
dioxus = { version = "=0.7.3", features = ["web"] }
forge-dioxus = { git = "https://github.com/isala404/forge", rev = "07e1a972d1cbfafc0bedb89764ee59c0b8ca8c5a" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlElement", "HtmlInputElement", "MediaQueryList", "Storage"] }
gloo-timers = { version = "0.3", features = ["futures"] }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }

[workspace]
