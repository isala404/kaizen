[package]
name = "kaizen-frontend"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
dioxus = { version = "=0.7.3", features = ["web"] }
forge-dioxus = { version = "0.8.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlElement", "HtmlInputElement", "MediaQueryList", "Storage"] }
gloo-timers = { version = "0.3", features = ["futures"] }

[workspace]
