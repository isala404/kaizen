[package]
name = "kaizen-frontend"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
dioxus = { version = "=0.7.3", features = ["web"] }
forge-dioxus = { git = "https://github.com/isala404/forge", rev = "07e1a972d1cbfafc0bedb89764ee59c0b8ca8c5a" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
dioxus-sdk = { version = "0.7", features = ["time", "storage"] }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "MediaQueryList", "Storage"] }

[target.'cfg(target_arch = "wasm32")'.dependencies.getrandom02]
package = "getrandom"
version = "0.2"
features = ["js"]

[target.'cfg(target_arch = "wasm32")'.dependencies.getrandom]
version = "0.3"
features = ["wasm_js"]

[workspace]
